<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="The copying room in three bands: courtyard wall and colonnade, copying desks, and the borrowing desk with a scroll tag">
  <!-- Far band: courtyard wall and colonnade. The stone does not travel.
       The obelisk shadow sweeps as the unseen sun moves. -->
  <rect x="0" y="0" width="1200" height="130" fill="#e9dab6"/>
  <polygon points="180,0 260,0 560,130 380,130" fill="#2e5a7b" opacity="0.35">
    <animate attributeName="points" dur="18s" repeatCount="indefinite"
      values="180,0 260,0 560,130 380,130; 300,0 380,0 760,130 560,130; 180,0 260,0 560,130 380,130"/>
  </polygon>
  <polygon points="60,130 84,26 100,26 122,130" fill="#18344a"/>
  <g fill="#f7f3e8">
    <rect x="880" y="8" width="44" height="122"/>
    <rect x="1010" y="8" width="44" height="122"/>
    <rect x="1140" y="8" width="44" height="122"/>
  </g>
  <g fill="#e8b45a">
    <circle cx="420" cy="40" r="2.4"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0.15;0.7;0.15"/></circle>
    <circle cx="520" cy="78" r="1.8"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.6;0.15;0.6"/></circle>
    <circle cx="640" cy="30" r="2"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0.2;0.65;0.2"/></circle>
  </g>
  <g fill="#2e5e3e">
    <polygon points="20,130 40,84 60,130"/>
    <polygon points="700,130 720,90 740,130"/>
    <polygon points="770,130 790,84 810,130"/>
  </g>
  <rect x="0" y="128" width="1200" height="4" fill="#aa946e"/>

  <!-- Middle band: copying desks. A hand at the frame edge slides tesserae
       counters along a tally groove one by one, then stills them. A stylus
       writes on the wax tablet and then smooths it. -->
  <rect x="0" y="132" width="1200" height="118" fill="#2e5a7b"/>
  <rect x="60" y="196" width="470" height="14" fill="#6e4a2c"/>
  <rect x="80" y="210" width="16" height="34" fill="#4e321c"/>
  <rect x="480" y="210" width="16" height="34" fill="#4e321c"/>
  <rect x="92" y="182" width="300" height="10" rx="5" fill="#18344a"/>
  <g>
    <rect x="120" y="168" width="16" height="16" fill="#f7f3e8">
      <animate attributeName="x" dur="9s" repeatCount="indefinite" values="120;168;168;120" keyTimes="0;0.3;0.7;1"/>
    </rect>
    <rect x="170" y="168" width="16" height="16" fill="#c02d20">
      <animate attributeName="x" dur="9s" repeatCount="indefinite" values="170;218;218;170" keyTimes="0;0.3;0.7;1"/>
    </rect>
    <rect x="220" y="168" width="16" height="16" fill="#5a8a60">
      <animate attributeName="x" dur="9s" repeatCount="indefinite" values="220;268;268;220" keyTimes="0;0.3;0.7;1"/>
    </rect>
    <rect x="270" y="168" width="16" height="16" fill="#609ad8"/>
  </g>
  <path d="M96 158 q10 -14 26 -12" stroke="#cea06e" stroke-width="9" fill="none" stroke-linecap="round">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M96 158 q10 -14 26 -12; M144 158 q10 -14 26 -12; M144 158 q10 -14 26 -12; M96 158 q10 -14 26 -12" keyTimes="0;0.3;0.7;1"/>
  </path>
  <!-- wax tablet: written upon, then smoothed -->
  <rect x="620" y="160" width="210" height="66" fill="#e2d8c4" stroke="#2e5e3e" stroke-width="4"/>
  <path d="M640 182 h170 M640 200 h150" stroke="#2e5a7b" stroke-width="4" fill="none">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.25;0.55;0.8;1"/>
  </path>
  <rect x="636" y="166" width="12" height="54" fill="#966e3c">
    <animate attributeName="x" dur="8s" repeatCount="indefinite" values="636;806;806;636" keyTimes="0;0.55;0.8;1"/>
  </rect>
  <!-- abacus frame at the room's side -->
  <g stroke="#f7f3e8" stroke-width="3">
    <rect x="930" y="152" width="220" height="86" fill="none" stroke="#2e5e3e" stroke-width="8"/>
    <line x1="938" y1="176" x2="1142" y2="176"/>
    <line x1="938" y1="204" x2="1142" y2="204"/>
  </g>
  <g fill="#c02d20">
    <circle cx="985" cy="176" r="9"><animate attributeName="cx" dur="11s" repeatCount="indefinite" values="985;1025;985" keyTimes="0;0.4;1"/></circle>
    <circle cx="1065" cy="204" r="9"><animate attributeName="cx" dur="11s" repeatCount="indefinite" values="1065;1015;1065" keyTimes="0;0.4;1"/></circle>
  </g>
  <g fill="#e8b45a"><circle cx="1045" cy="176" r="9"/><circle cx="985" cy="204" r="9"/></g>

  <!-- Near band: the borrowing desk. A hand lifts the scroll tag by its cord,
       turns it once toward the light, and lays it down, seal dot uppermost. -->
  <rect x="0" y="250" width="1200" height="110" fill="#5c3c22"/>
  <rect x="0" y="250" width="1200" height="12" fill="#7a5434"/>
  <ellipse cx="240" cy="306" rx="86" ry="17" fill="#2e5a7b"/>
  <ellipse cx="240" cy="300" rx="78" ry="15" fill="#609ad8"/>
  <g fill="none" stroke-width="6">
    <circle cx="214" cy="292" r="12" stroke="#c02d20"/>
    <circle cx="244" cy="288" r="12" stroke="#e8b45a"/>
    <circle cx="272" cy="292" r="12" stroke="#18344a"/>
  </g>
  <polygon points="430,286 640,292 634,338 424,332" fill="#f7f3e8"/>
  <g stroke="#2e5a7b" stroke-width="3">
    <line x1="452" y1="300" x2="600" y2="304"/><line x1="450" y1="314" x2="580" y2="318"/>
    <line x1="448" y1="326" x2="610" y2="330"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="12s" repeatCount="indefinite"
      values="0 900 268; -7 900 268; 0 900 268; 0 900 268" keyTimes="0;0.18;0.36;1"/>
    <line x1="900" y1="252" x2="900" y2="272" stroke="#2e5a7b" stroke-width="5"/>
    <rect x="862" y="270" width="76" height="76" rx="9" fill="#f7f3e8" stroke="#e2d8c4" stroke-width="3"/>
    <circle cx="900" cy="284" r="8" fill="#18344a"/>
    <line x1="926" y1="280" x2="926" y2="322" stroke="#2e5e3e" stroke-width="4"/>
    <polygon points="862,322 938,322 938,346 862,346" fill="#e2d8c4"/>
    <circle cx="900" cy="334" r="7" fill="#c02d20"/>
    <path d="M852 258 q8 -10 20 -9" stroke="#cea06e" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
